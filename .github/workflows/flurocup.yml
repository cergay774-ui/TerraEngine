name: FluroCup APK

on:
  push:
    paths:
      - "FluroCup/**"
      - ".github/workflows/flurocup.yml"
  pull_request:
    paths:
      - "FluroCup/**"
      - ".github/workflows/flurocup.yml"
  workflow_dispatch:

concurrency:
  group: flurocup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: FluroCup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :core-model:test

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FluroCup-debug-apk
          path: FluroCup/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: FluroCup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --no-daemon --stacktrace :core-engine:assembleDebugAndroidTest

      - name: Preview and shader tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          working-directory: FluroCup
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/device-tests.sh
