name: Android APK

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "game/**"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_PATH: game
  HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  # Все прежние сборки подписаны ключом из образа godot-ci:4.3. Новая сборка подписывается
  # тем же ключом — тогда она ставится поверх старой и сохранения игрока остаются.
  signing-key:
    name: Ключ подписи
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Достать ключ из образа 4.3
        run: |
          mkdir -p key
          cp /root/debug.keystore key/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: key/debug.keystore
          retention-days: 1

  android:
    name: Сборка APK
    needs: signing-key
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ключ подписи
        uses: actions/download-artifact@v4
        with:
          name: signing-key
          path: /tmp/key

      - name: Настройка Godot (шаблоны экспорта, Android SDK)
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          if [ "$HOME" != "/root" ]; then
            mv /root/.config/godot ~/.config/godot
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          ls ~/.config/godot ~/.local/share/godot/export_templates

      - name: Импорт ресурсов
        run: |
          cd $PROJECT_PATH
          godot --headless --import || true
          godot --headless --path . --quit-after 5 2>&1 | tee ../run.log
          if grep -q "SCRIPT ERROR" ../run.log; then echo "Ошибки в скриптах"; exit 1; fi

      - name: Сборка release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -v -p build
          EXPORT_DIR="$(readlink -f build)"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/release.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$RELEASE_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_PASSWORD"
          else
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/key/debug.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          fi
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Android" "$EXPORT_DIR/motor-garage.apk" 2>&1 | tail -n 80
          test -f "$EXPORT_DIR/motor-garage.apk"
          ls -la "$EXPORT_DIR"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: motor-garage-apk
          path: build/*.apk
          if-no-files-found: error
